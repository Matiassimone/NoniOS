[package]
name = "nonios"
version = "0.1.0"
description = "NoniOS — an open-source accessibility kiosk launcher for Windows"
authors = ["NoniOS contributors"]
license = "MIT"
repository = "https://github.com/nonios/nonios"
edition = "2021"
rust-version = "1.77"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nonios_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Typed errors for the kiosk lockdown layer. Pinned exact per AGENTS.md
# (crates touching kiosk/ never use loose semver ranges).
thiserror = "=2.0.19"

# Win32 lockdown bindings — only compiled on Windows. Kept out of the dev-host
# (macOS/Linux) build entirely so the crate still builds and lints there.
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
] }

